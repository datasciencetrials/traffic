name: Publish traffic workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check public entry accuracy
        run: node scripts/check-public-entry.mjs
      - name: Prepare public workspace
        run: |
          mkdir -p public/data public/assets
          cp -r assets/* public/assets/ 2>/dev/null || true
          cp -r data/* public/data/ 2>/dev/null || true
          cp -r legacy_assets public/ 2>/dev/null || true
          cp *.json public/ 2>/dev/null || true
          cp *.geojson public/ 2>/dev/null || true
          cp index.html mobility.html mobility.css workspace-tabs.css mobility.js favicon.svg icons.svg robots.txt .nojekyll public/ 2>/dev/null || true
          test -s public/index.html
          test -d public/assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public workspace
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy public workspace
        id: deployment
        uses: actions/deploy-pages@v4
