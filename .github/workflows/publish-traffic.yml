name: Publish traffic workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare public workspace
        run: |
          mkdir -p public/data
          cp index.html mobility.html mobility.css workspace-tabs.css mobility.js favicon.svg robots.txt .nojekyll public/
          cp data/traffic_dashboard_data.json public/data/
          test -s public/index.html
          test -s public/data/traffic_dashboard_data.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public workspace
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy public workspace
        id: deployment
        uses: actions/deploy-pages@v4
